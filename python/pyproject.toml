[project]
name = "moepager-tools"
version = "0.1.0"
description = "Fixture generation, benchmark metric parsing and plotting for moepager"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
